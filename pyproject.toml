[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neural-emd"
version = "0.1.0"
description = "Neural Empirical Mode Decomposition: a differentiable, learned replacement for EMD sifting, in PyTorch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Aous Abdo" }]
keywords = ["signal-processing", "emd", "empirical-mode-decomposition", "hilbert-huang", "pytorch", "decomposition", "time-series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Classical EMD / EEMD / VMD baselines in nemd.classical
baselines = ["EMD-signal>=1.5", "vmdpy>=0.2"]
dev = ["pytest>=7.0", "EMD-signal>=1.5", "vmdpy>=0.2"]

[project.urls]
Homepage = "https://github.com/aousabdo/neural-emd"
Issues = "https://github.com/aousabdo/neural-emd/issues"

[tool.hatch.build.targets.wheel]
packages = ["nemd"]

[tool.hatch.build.targets.sdist]
include = ["nemd", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
